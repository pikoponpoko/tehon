<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tehon</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#E8EFEA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tehon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<div class="app" id="app">
  <aside id="side" class="sb">
    <div class="brand">Tehon <span class="sync" id="sync"><i></i>未接続</span></div>
    <div class="nav setbtn"><button id="setBtn"><span>設定</span></button></div>
    <div class="sec"><div class="nav" id="lib"></div></div>
    <div class="sec"><h3><button class="sh" data-sec="status">ステータス</button></h3><div class="nav" id="statuses"></div></div>
    <div class="sec"><h3><button class="sh" data-sec="folders">フォルダ</button></h3><div class="nav" id="folders"></div></div>
    <div class="sec"><h3><button class="sh" data-sec="tags">タグ</button></h3><div class="nav chips" id="tags"></div></div>
    <div class="sec" id="archSec" hidden><h3><button class="sh" data-sec="arch">アーカイブ</button></h3><div class="nav" id="arch"></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="bar">
      <button class="btn ic menu" id="menuBtn" aria-label="メニュー">☰</button>
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="検索" autocomplete="off"></label>
      <span class="sortw" id="typeW"><svg class="sortic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z"/></svg><select class="btn" id="type" aria-label="種類"><option value="">すべての種類</option></select></span>
      <span class="sortw"><svg class="sortic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v12M2 11l3 3 3-3M11 14V2M8 5l3-3 3 3"/></svg><select class="btn" id="sort" aria-label="並べ替え">
        <option value="added-desc">追加日（新しい順）</option>
        <option value="added-asc">追加日（古い順）</option>
        <option value="name-asc">名前</option>
        <option value="kind">種類</option>
        <option value="random">ランダム</option>
      </select></span>
      <button class="btn" id="shuffle" hidden aria-label="シャッフル"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h3l6 8h3M2 12h3l6-8h3M12 2l2 2-2 2M12 10l2 2-2 2"/></svg><span>シャッフル</span></button>
      <span class="seg" role="group" aria-label="レイアウト"><button id="lGrid" aria-label="グリッド" title="グリッド"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button><button id="lFall" class="on" aria-label="ウォーターフォール" title="ウォーターフォール"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="8" rx="1"/><rect x="9" y="1" width="6" height="5" rx="1"/><rect x="1" y="11" width="6" height="4" rx="1"/><rect x="9" y="8" width="6" height="7" rx="1"/></svg></button><button id="lKan" aria-label="カンバン" title="カンバン"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="6" y="1" width="4" height="9" rx="1"/><rect x="11" y="1" width="4" height="11" rx="1"/></svg></button></span>
      <input class="size" id="size" type="range" min="1" max="12" step="1" value="6" aria-label="列数" title="列数">
      <button class="btn pri" id="updBtn" hidden>更新</button>
      <button class="btn" id="selBtn">選択</button>
      <button class="btn pri" id="addBtn">＋ 追加</button>
      <button class="btn ic fold" id="barBtn" aria-label="ツールバーを畳む" title="ツールバーを畳む"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg></button>
      <input type="file" id="file" accept="image/*,video/*,.txt,.md,text/plain" multiple hidden>
      <input type="file" id="eagleDir" webkitdirectory multiple hidden>
    </div>
    <button class="btn ic fold" id="barOpen" aria-label="ツールバーを開く" title="ツールバーを開く"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5 4.5-4.5"/></svg></button>
    <div class="selbar" id="selbar" hidden>
      <span class="seln"><b id="selN">0</b> 件選択</span>
      <button class="btn ic" id="bFav" aria-label="お気に入り" title="お気に入り"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5l-1.2-1.1C6 15.1 3 12.4 3 9.1 3 6.4 5.1 4.5 7.6 4.5c1.6 0 3.2.8 4.4 2.1 1.2-1.3 2.8-2.1 4.4-2.1 2.5 0 4.6 1.9 4.6 4.6 0 3.3-3 6-7.8 10.3z"/></svg></button>
      <button class="btn ic" id="bTag" aria-label="タグを追加" title="タグを追加"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.2V4a1 1 0 0 1 1-1h8.2a1 1 0 0 1 .7.3l8 8a1 1 0 0 1 0 1.4l-8.2 8.2a1 1 0 0 1-1.4 0l-8-8a1 1 0 0 1-.3-.7z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></svg></button>
      <button class="btn ic" id="bStatus" aria-label="ステータス" title="ステータス"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/></svg></button>
      <button class="btn ic" id="bMove" aria-label="移動" title="移動"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 13.5h6M12.5 11l2.5 2.5-2.5 2.5"/></svg></button>
      <button class="btn ic" id="bLink" aria-label="リンク" title="リンク"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg></button>
      <button class="btn ic" id="bUnlink" aria-label="リンクを外す" title="リンクを外す" hidden><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/><path d="M3 3l18 18"/></svg></button>
      <button class="btn ic" id="bRestore" aria-label="元に戻す" title="元に戻す" hidden><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 3.5v5.1h5.1"/></svg></button>
      <button class="btn ic del" id="bTrash" aria-label="ゴミ箱へ" title="ゴミ箱へ"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
      <span class="selsp"></span>
      <button class="btn ic" id="bAll" aria-label="すべて選択" title="すべて選択"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7.5 12l3 3 6-6"/></svg></button>
      <button class="btn ic" id="bNone" aria-label="解除" title="解除"><svg class="hi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="selbar" id="dupbar" hidden><button class="btn pri" id="bDup"></button></div>
    <div class="grid-wrap sb" id="wrap"><div class="grid fall" id="grid"></div></div>
  </main>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="vClose" aria-label="閉じる">✕</button>
    <span class="t" id="vTitle"></span><span class="vstate" id="vState"></span><button class="vbtn" id="vReload" hidden>読み込み直す</button>
    <button class="vbtn" id="vOut" aria-label="縮小">−</button>
    <button class="vbtn" id="vFit" aria-label="全体表示"><span id="vZoom">100%</span></button>
    <button class="vbtn" id="vIn" aria-label="拡大">＋</button>
    <span class="vpage" id="vPage" hidden><button class="vbtn" id="vPgUp" aria-label="前のページ">↑</button><span id="vPgN"></span><button class="vbtn" id="vPgDn" aria-label="次のページ">↓</button></span>
    <span class="swatches" role="group" aria-label="背景"><button class="swatch sw-theme" data-bg="theme" aria-label="テーマ" title="テーマ"></button><button class="swatch sw-blur" data-bg="blur" aria-label="ぼかし" title="ぼかし"></button><button class="swatch sw-dark" data-bg="dark" aria-label="暗く" title="暗く"></button></span>
    <button class="vbtn" id="vPlay" hidden>❚❚</button>
    <button class="vbtn" id="vFav" aria-label="お気に入り"><svg class="hi" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    <button class="vbtn" id="vDel" aria-label="ゴミ箱へ" title="ゴミ箱へ"><svg class="hi" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
    <button class="vbtn" id="vPrev" aria-label="前へ">‹</button>
    <button class="vbtn" id="vNext" aria-label="次へ">›</button>
  </div>
  <div class="stage" id="stage"><canvas id="vc"></canvas><img id="vi" alt="" draggable="false" hidden><video id="vv" muted loop playsinline hidden></video><textarea id="vt" spellcheck="false" aria-label="テキスト" hidden></textarea><iframe id="vf" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="動画" hidden></iframe><canvas id="v3" hidden></canvas><iframe id="vh" sandbox title="プレビュー" hidden></iframe><div class="vedge" id="vEdge"></div></div>
  <div class="vfoot" id="vfoot"></div>
</div>

<div class="dlg" id="dlg" hidden><form id="dlgForm"></form></div>
<div class="toast" id="toast" hidden></div>
<div class="drop" id="drop" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
