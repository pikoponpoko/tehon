# Windows desktop version. A push to main whose desktop/package.json version has no Release yet builds the
# installer and publishes it as Release v<version>. Other pushes touching the app only build it (Actions artifact).
name: Desktop

on:
  push:
    paths: ["desktop/**", "src/**", "public/**", "index.html", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$v" >/dev/null 2>&1; then echo "release=1" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Tehon-Setup-${{ steps.v.outputs.version }}
          path: desktop/release/*.exe
      - name: Release
        if: steps.v.outputs.release == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" desktop/release/*.exe --target "$GITHUB_SHA" --title "Tehon ${{ steps.v.outputs.version }}" --notes ""
