# Desktop versions (Windows, macOS). A push to main whose desktop/package.json version has no Release yet builds both
# and publishes them as Release v<version>. Other pushes touching the app only build them (Actions artifacts).
name: Desktop

on:
  push:
    paths: ["desktop/**", "src/**", "public/**", "index.html", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: desktop/release/*.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Tehon-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$v" >/dev/null 2>&1; then echo "release=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.release == '1'
        with:
          path: out
          merge-multiple: true
      - name: Release
        if: steps.v.outputs.release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" out/* --target "$GITHUB_SHA" --title "Tehon ${{ steps.v.outputs.version }}" --notes ""
