# Cloudflare Workers (static assets + worker.js for /api/*). The name must match the Worker connected to this repo.
name = "tehon"
main = "worker.js"
compatibility_date = "2026-10-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
